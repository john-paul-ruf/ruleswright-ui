appId: dev.ruleswright.ui
productName: Ruleswright
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
mac:
  target: dmg
  category: public.app-category.role-playing-games
dmg:
  artifactName: ${productName}-${version}.${ext}
win:
  target: nsis
nsis:
  oneClick: false
linux:
  target: AppImage
